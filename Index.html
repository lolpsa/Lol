<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Супермаркет: Сортировка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <header id="game-header">
      <h1>Супермаркет: Сортировка</h1>
      <div id="game-stats">
        <span id="score">Очки: 0</span>
        <span id="remaining">Осталось: 20</span>
        <span id="level">Уровень: 1</span>
      </div>
    </header>

    <main id="game-area">
      <div id="shelves-container"></div>
    </main>

    <footer id="product-tray">
      <div id="product-list"></div>
    </footer>
  </div>

  <div id="level-complete-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Уровень пройден!</h2>
      <p>Набрано очков: <span id="final-score">0</span></p>
      <button id="restart-button">Играть снова</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
